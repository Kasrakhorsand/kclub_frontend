# /etc/nginx/sites-available/kclub  (replace test.kclub.ir with your domain)
server {
    listen 80;
    server_name test.kclub.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name test.kclub.ir;

    ssl_certificate     /etc/letsencrypt/live/test.kclub.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.kclub.ir/privkey.pem;

    # Test server: keep it private (create with: htpasswd -c /etc/nginx/.htpasswd kclub)
    auth_basic "K Club test";
    auth_basic_user_file /etc/nginx/.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hero videos, textures and logo: long cache, range requests for video seeking
    location ~ ^/(media|models|brand)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
